[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "datasail-scaling"
version = "0.1.0"
description = "A balance-aware approximation for scaling leakage-conscious molecular dataset splitting."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.12,<1"]
experiments = [
    "datasail",
    "lightgbm",
    "matplotlib",
    "memory-profiler",
    "pyyaml",
    "rdkit",
    "seaborn",
    "tqdm",
    "xgboost",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
